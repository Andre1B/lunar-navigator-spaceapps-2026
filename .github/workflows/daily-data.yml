name: Refresh rolling lunar dates
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Commit the validated UTC dataset for the connected Lunar Pages build
        type: boolean
        default: false
      force_refresh:
        description: Recompute even if the committed dataset is already current
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lunar-daily-main
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'Andre1B/lunar-navigator-spaceapps-2026' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
      FORCE_REFRESH: ${{ inputs.force_refresh || false }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Decide whether the UTC day needs a rebuild
        id: coverage
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const manifest=JSON.parse(readFileSync('public/data/manifest.json','utf8'));
          const today=new Date().toISOString().slice(0,10);
          const needed=process.env.FORCE_REFRESH==='true'||manifest.coveragePolicy?.mode!=='rolling-calendar-years'||manifest.coveragePolicy?.asOfUtcDate!==today;
          appendFileSync(process.env.GITHUB_OUTPUT,`needed=${needed}\n`);
          console.log(JSON.stringify({utcDay:today,previousAsOf:manifest.coveragePolicy?.asOfUtcDate??null,rebuild:needed}));
          NODE
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.coverage.outputs.needed == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scientific/requirements.txt
      - name: Restore pinned static scientific inputs
        if: steps.coverage.outputs.needed == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            scientific/cache/dem
            scientific/cache/kernels
          key: lunar-science-inputs-${{ runner.os }}-${{ hashFiles('scientific/source-lock.json') }}
      - name: Install the generator and verify or fetch locked inputs
        if: steps.coverage.outputs.needed == 'true'
        working-directory: scientific
        run: |
          python -m pip install -r requirements.txt
          python fetch_sources.py
          python fetch_sources.py --check-only
      - name: Generate the complete rolling dataset in staging, validate and promote
        if: steps.coverage.outputs.needed == 'true'
        working-directory: scientific
        run: python -u rebuild.py
      - run: npm run check:data
      - run: npm test
      - run: npm run credits
      - run: npm run build
      - name: Commit validated generated files and fast-forward main
        if: env.PUBLISH == 'true'
        run: node scripts/commit-daily-data.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify the clean committed revision
        if: env.PUBLISH == 'true'
        run: npm run build
        # Cloudflare's existing GitHub integration builds main into dist.
        # No Cloudflare token is stored in this workflow or repository.
      - name: Keep the generator validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lunar-daily-validation-${{ github.run_id }}
          path: |
            scientific/cache/rolling-regression.json
            scientific/cache/rolling-generation-summary.json
          if-no-files-found: ignore
          retention-days: 14
